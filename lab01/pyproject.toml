[project]
name = "lab01-tokenization"
version = "0.1.0"
description = "Lab01 tokenization benchmark (UMISI)"
readme = "README.md"
authors = [
    { name = "McEnigma24", email = "wojciech.mackowiak24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mpi4py>=4.1.2",
    "openmpi>=5.0.11",
    "torch>=2.14.1",
    "numpy>=2.0.0",
    "sentencepiece>=0.2.2",
    "transformers>=4.48.0",
    "datasets>=3.0.0",
    "matplotlib>=3.9.0",
    "tqdm>=4.66.0",
]

[project.scripts]
lab01 = "lab01_tokenization.main:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
