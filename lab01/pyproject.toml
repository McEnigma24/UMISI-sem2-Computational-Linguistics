[project]
name = "lab01-tokenization"
version = "0.1.0"
description = "Lab01 tokenization benchmark (UMISI)"
readme = "README.md"
authors = [
    { name = "McEnigma24", email = "wojciech.mackowiak24@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mpi4py>=4.1.2",
    "openmpi>=5.0.11",
    "torch>=2.14.1",
]

[project.scripts]
lab01 = "lab01_tokenization.main:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
